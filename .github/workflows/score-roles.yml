name: Score roles with Claude

# Runs when you open an issue titled "Score roles…" from the tracker's Add Roles
# window. Claude Code scores each role on your Claude plan, saves the results to
# public/data/added-roles.json, comments a summary, closes the issue and
# redeploys the site.
#
# One-time setup: run `claude setup-token` on your computer and save the token
# as the repository secret CLAUDE_CODE_OAUTH_TOKEN.

on:
  issues:
    types: [opened]

concurrency:
  group: score-roles
  cancel-in-progress: false

jobs:
  score:
    # Only the repo owner's own requests run (the repo is public).
    if: startsWith(github.event.issue.title, 'Score roles') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the scoring prompt
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/score-roles.mjs prepare

      - name: Score with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read scoring-prompt.md in the repository root and follow it exactly.
            For any job without a pasted description, open its URL with WebFetch to read the posting
            (if a page can't be read, score it as Tier 5 with what you can tell).
            Write ONLY the resulting JSON array to a file named scored.json in the repository root.
            Do not edit any other file.
          claude_args: |
            --allowedTools "Read,Write,WebFetch"
            --max-turns 40

      - name: Save scored roles
        run: node scripts/score-roles.mjs merge

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/added-roles.json
          git diff --cached --quiet || git commit -m "Add roles scored from #${{ github.event.issue.number }}"
          git push

      - name: Report back on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file summary.md
          gh issue close ${{ github.event.issue.number }}

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Scoring failed — open the Actions run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If it says the token is missing, add the CLAUDE_CODE_OAUTH_TOKEN secret (run \`claude setup-token\`)."

  deploy:
    needs: score
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
